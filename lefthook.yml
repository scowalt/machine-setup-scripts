pre-commit:
  commands:
    gitleaks:
      run: gitleaks protect --staged --no-banner
    shellcheck:
      glob: '*.sh'
      run: bunx shellcheck {staged_files}
      stage_fixed: true
      fail_text: Shellcheck found issues in shell scripts
    markdownlint:
      glob: '*.md'
      run: bunx markdownlint-cli --fix {staged_files}
      stage_fixed: true
      fail_text: Markdownlint found issues in markdown files
    no-comments:
      run: uv run --no-project --python 3.14 --with-requirements .comment-policy/requirements.txt python .comment-policy/check.py --staged
