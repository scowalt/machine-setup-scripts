name: Contracts

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.11'
      - name: ShellCheck
        run: bunx shellcheck *.sh
      - name: Markdownlint
        run: bunx markdownlint-cli *.md

  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      suites: ${{ steps.list.outputs.suites }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - id: list
        run: echo "suites=$(env -i PATH=/usr/bin:/bin /usr/bin/python3 -I tools/run-contracts.py --list)" >> "$GITHUB_OUTPUT"

  contract:
    needs: inventory
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.inventory.outputs.suites) }}
    name: ${{ matrix.suite }}
    env:
      NODE_VERSION: '24.20.0'
      NODE_SHA256: 2f2c0da162318f0de47665410c7c8c2ed3d36c8f3105de4bbc61176c70a7cbf2
      MISE_VERSION: v2026.7.13
      CHEZMOI_VERSION: v2.70.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.11'
      - id: image
        run: echo "version=${ImageOS}-${ImageVersion}" >> "${GITHUB_OUTPUT}"
      - id: tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/tools
          key: contract-tools-${{ steps.image.outputs.version }}-${{ runner.arch }}-node${{ env.NODE_VERSION }}-${{ env.NODE_SHA256 }}-mise${{ env.MISE_VERSION }}-chezmoi${{ env.CHEZMOI_VERSION }}
      - name: Install Node, mise and Chezmoi
        if: steps.tools.outputs.cache-hit != 'true'
        run: |
          mkdir -p "${RUNNER_TEMP}/tools/node"
          curl -fsSL -o "${RUNNER_TEMP}/node.tar.xz" "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-x64.tar.xz"
          echo "${NODE_SHA256}  ${RUNNER_TEMP}/node.tar.xz" | sha256sum -c -
          tar -xJf "${RUNNER_TEMP}/node.tar.xz" --strip-components 1 -C "${RUNNER_TEMP}/tools/node"
          rm "${RUNNER_TEMP}/node.tar.xz"
          curl -fsSL https://mise.run | MISE_INSTALL_PATH="${RUNNER_TEMP}/tools/mise" sh
          sh -c "$(curl -fsSL https://get.chezmoi.io)" -- -b "${RUNNER_TEMP}/tools" -t "${CHEZMOI_VERSION}"
          mkdir -p "${RUNNER_TEMP}/tools/debs"
          (cd "${RUNNER_TEMP}/tools/debs" && apt-get download fish fish-common) || rm -rf "${RUNNER_TEMP}/tools/debs"
      - name: Install fish
        run: |
          sudo dpkg -i "${RUNNER_TEMP}"/tools/debs/*.deb ||
            sudo apt-get install -y -qq -f fish ||
            { sudo apt-get update -qq && sudo apt-get install -y -qq fish; }
      - name: Select native tools
        run: |
          {
            echo "SETUP_TEST_NODE=${RUNNER_TEMP}/tools/node/bin/node"
            echo "PWSH_BIN=$(readlink -f "$(command -v pwsh)")"
            echo "SETUP_TEST_MISE=${RUNNER_TEMP}/tools/mise"
            echo "SETUP_TEST_CHEZMOI=${RUNNER_TEMP}/tools/chezmoi"
            echo "SETUP_TEST_BUN=$(readlink -f "$(command -v bun)")"
          } >> "$GITHUB_ENV"
      - name: Run contract
        env:
          SUITE: ${{ matrix.suite }}
        run: env -i PATH=/usr/bin:/bin /usr/bin/python3 -I tools/run-contracts.py --node "${SETUP_TEST_NODE}" --pwsh "${PWSH_BIN}" --mise "${SETUP_TEST_MISE}" --chezmoi "${SETUP_TEST_CHEZMOI}" --bun "${SETUP_TEST_BUN}" "${SUITE}"
      - name: Show contract logs
        if: failure()
        run: tail -n +1 /tmp/setup-fixture-matrix-*/*.log
