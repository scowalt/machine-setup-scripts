name: Contracts

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.11'
      - name: ShellCheck
        run: bunx shellcheck *.sh
      - name: Markdownlint
        run: bunx markdownlint-cli *.md

  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      suites: ${{ steps.list.outputs.suites }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - id: list
        run: echo "suites=$(env -i PATH=/usr/bin:/bin /usr/bin/python3 -I tools/run-contracts.py --list)" >> "$GITHUB_OUTPUT"

  contract:
    needs: inventory
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.inventory.outputs.suites) }}
    name: ${{ matrix.suite }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.20.0'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.11'
      - name: Install fish, mise and Chezmoi
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fish
          curl -fsSL https://mise.run | MISE_VERSION=v2026.7.13 MISE_INSTALL_PATH="${RUNNER_TEMP}/tools/mise" sh
          sh -c "$(curl -fsSL https://get.chezmoi.io)" -- -b "${RUNNER_TEMP}/tools" -t v2.70.0
      - name: Select native tools
        run: |
          {
            echo "SETUP_TEST_NODE=$(readlink -f "$(command -v node)")"
            echo "PWSH_BIN=$(readlink -f "$(command -v pwsh)")"
            echo "SETUP_TEST_MISE=${RUNNER_TEMP}/tools/mise"
            echo "SETUP_TEST_CHEZMOI=${RUNNER_TEMP}/tools/chezmoi"
            echo "SETUP_TEST_BUN=$(readlink -f "$(command -v bun)")"
          } >> "$GITHUB_ENV"
      - name: Run contract
        env:
          SUITE: ${{ matrix.suite }}
        run: env -i PATH=/usr/bin:/bin /usr/bin/python3 -I tools/run-contracts.py --node "${SETUP_TEST_NODE}" --pwsh "${PWSH_BIN}" --mise "${SETUP_TEST_MISE}" --chezmoi "${SETUP_TEST_CHEZMOI}" --bun "${SETUP_TEST_BUN}" "${SUITE}"
      - name: Show contract logs
        if: failure()
        run: tail -n +1 /tmp/setup-fixture-matrix-*/*.log
